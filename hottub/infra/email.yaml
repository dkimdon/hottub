AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Email sending identity for the hot tub system (Amazon SES).  One stack,
  hottub-email, shared by the test and live environments, in the same region
  as they are.  Lets Cognito send invitations and password-reset codes from
  the organisation's own domain instead of Cognito's shared address.

# Deploy with "scripts/deploy.py shared".  The domain only becomes usable once
# the three DKIM records in the outputs have been added to its DNS.

Parameters:
  EmailDomain:
    Type: String
    Description: Domain that mail is sent from, e.g. example.org

Resources:
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref EmailDomain
      DkimAttributes:
        SigningEnabled: true

Outputs:
  IdentityArn:
    Value: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailDomain}
  DkimRecord1:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName1} CNAME ${EmailIdentity.DkimDNSTokenValue1}"
  DkimRecord2:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName2} CNAME ${EmailIdentity.DkimDNSTokenValue2}"
  DkimRecord3:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName3} CNAME ${EmailIdentity.DkimDNSTokenValue3}"
