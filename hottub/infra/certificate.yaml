AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TLS certificate for the hot tub web UI's own domain name (live only: the
  test environment is a sandbox served at its CloudFront address).  Stack
  hottub-certificate.  It MUST be deployed in us-east-1: CloudFront only
  accepts certificates from there.

# Deploy with "scripts/deploy.py shared".  The stack does not finish creating
# until the certificate's validation records have been added to DNS; the
# script prints them.

Parameters:
  LiveDomainName:
    Type: String

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref LiveDomainName
      ValidationMethod: DNS

Outputs:
  CertificateArn:
    Value: !Ref Certificate
